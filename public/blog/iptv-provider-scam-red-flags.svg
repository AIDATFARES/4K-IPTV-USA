<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">IPTV provider scam red flags checklist</title>
  <desc id="desc">Warning cards summarize risky payment pressure, impossible guarantees, missing trials, and weak support.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090b13"/><stop offset="1" stop-color="#1a1014"/></linearGradient><linearGradient id="warn" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffb02e"/><stop offset="1" stop-color="#ff5e45"/></linearGradient></defs>
  <rect width="1200" height="675" rx="34" fill="url(#bg)"/>
  <circle cx="600" cy="116" r="66" fill="#ff654c" opacity=".12"/><path d="M600 55l65 116H535z" fill="none" stroke="url(#warn)" stroke-width="10" stroke-linejoin="round"/><path d="M600 91v38" stroke="#ffb02e" stroke-width="10" stroke-linecap="round"/><circle cx="600" cy="148" r="6" fill="#ffb02e"/>
  <text x="600" y="220" text-anchor="middle" fill="#f6f2ed" font-family="Arial, sans-serif" font-size="28" font-weight="700">RED FLAGS TO CHECK BEFORE PAYMENT</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(78 270)"><rect width="500" height="130" rx="22" fill="#1b171d" stroke="#ff6b55" stroke-opacity=".45"/><circle cx="58" cy="65" r="29" fill="#ff634b" opacity=".18"/><path d="M46 53l24 24m0-24L46 77" stroke="#ff735e" stroke-width="7" stroke-linecap="round"/><text x="108" y="57" fill="#fff" font-size="22" font-weight="700">Impossible guarantees</text><text x="108" y="88" fill="#a9a5ae" font-size="17">“Zero buffering forever” is not realistic.</text></g>
    <g transform="translate(622 270)"><rect width="500" height="130" rx="22" fill="#1b171d" stroke="#ffb02e" stroke-opacity=".45"/><circle cx="58" cy="65" r="29" fill="#ffb02e" opacity=".16"/><path d="M58 45v25m0 17v1" stroke="#ffc34f" stroke-width="7" stroke-linecap="round"/><text x="108" y="57" fill="#fff" font-size="22" font-weight="700">No useful trial</text><text x="108" y="88" fill="#a9a5ae" font-size="17">You cannot test your real setup first.</text></g>
    <g transform="translate(78 430)"><rect width="500" height="130" rx="22" fill="#1b171d" stroke="#ffb02e" stroke-opacity=".45"/><circle cx="58" cy="65" r="29" fill="#ffb02e" opacity=".16"/><path d="M43 58h30v22H43zm6-12h18v12" fill="none" stroke="#ffc34f" stroke-width="5"/><text x="108" y="57" fill="#fff" font-size="22" font-weight="700">Payment pressure</text><text x="108" y="88" fill="#a9a5ae" font-size="17">Urgency plus irreversible payment is risky.</text></g>
    <g transform="translate(622 430)"><rect width="500" height="130" rx="22" fill="#1b171d" stroke="#ff6b55" stroke-opacity=".45"/><circle cx="58" cy="65" r="29" fill="#ff634b" opacity=".18"/><path d="M44 50h28v21H58l-10 9v-9h-4z" fill="none" stroke="#ff735e" stroke-width="5" stroke-linejoin="round"/><text x="108" y="57" fill="#fff" font-size="22" font-weight="700">Unclear support</text><text x="108" y="88" fill="#a9a5ae" font-size="17">Generic replies disappear after payment.</text></g>
  </g>
</svg>
