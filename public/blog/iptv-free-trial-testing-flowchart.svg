<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">IPTV free trial testing flowchart</title>
  <desc id="desc">A seven-step flow from testing a device through making a subscription decision.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080c17"/><stop offset="1" stop-color="#111720"/></linearGradient><linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#4b9cff"/><stop offset="1" stop-color="#f6bd3d"/></linearGradient></defs>
  <rect width="1200" height="675" rx="34" fill="url(#bg)"/>
  <text x="600" y="84" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="30" font-weight="700">A PRACTICAL FREE TRIAL TEST</text>
  <text x="600" y="121" text-anchor="middle" fill="#8e99aa" font-family="Arial, sans-serif" font-size="18">Use your real setup during your normal viewing time</text>
  <path d="M140 270h920M1060 270v175H140" fill="none" stroke="url(#line)" stroke-width="6" stroke-linecap="round" opacity=".55"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <g transform="translate(62 190)"><rect width="220" height="160" rx="24" fill="#151d2a" stroke="#4b9cff" stroke-opacity=".5"/><circle cx="110" cy="52" r="27" fill="#4b9cff" opacity=".18"/><rect x="91" y="37" width="38" height="27" rx="4" fill="none" stroke="#62a9ff" stroke-width="4"/><text x="110" y="112" fill="#fff" font-size="20" font-weight="700">1. Device test</text><text x="110" y="138" fill="#8e99aa" font-size="15">Use your main screen</text></g>
    <g transform="translate(306 190)"><rect width="220" height="160" rx="24" fill="#151d2a" stroke="#4b9cff" stroke-opacity=".4"/><circle cx="110" cy="52" r="27" fill="#4b9cff" opacity=".18"/><path d="M94 52h32m-16-16v32" stroke="#62a9ff" stroke-width="5" stroke-linecap="round"/><text x="110" y="112" fill="#fff" font-size="20" font-weight="700">2. App login</text><text x="110" y="138" fill="#8e99aa" font-size="15">Confirm credentials</text></g>
    <g transform="translate(550 190)"><rect width="220" height="160" rx="24" fill="#151d2a" stroke="#58b7d8" stroke-opacity=".45"/><circle cx="110" cy="52" r="27" fill="#58b7d8" opacity=".17"/><path d="M99 37l27 15-27 15z" fill="#6bd2ef"/><text x="110" y="112" fill="#fff" font-size="20" font-weight="700">3. Live TV</text><text x="110" y="138" fill="#8e99aa" font-size="15">Switch many channels</text></g>
    <g transform="translate(794 190)"><rect width="220" height="160" rx="24" fill="#151d2a" stroke="#f6bd3d" stroke-opacity=".45"/><circle cx="110" cy="52" r="27" fill="#f6bd3d" opacity=".16"/><path d="M95 38h30v28H95zm0 9h30" fill="none" stroke="#f6bd3d" stroke-width="4"/><text x="110" y="112" fill="#fff" font-size="20" font-weight="700">4. Peak-time test</text><text x="110" y="138" fill="#8e99aa" font-size="15">Check busy hours</text></g>
    <g transform="translate(794 405)"><rect width="220" height="160" rx="24" fill="#151d2a" stroke="#f6bd3d" stroke-opacity=".45"/><text x="110" y="60" fill="#f6bd3d" font-size="33" font-weight="700">EPG</text><text x="110" y="112" fill="#fff" font-size="20" font-weight="700">5. Guide + VOD</text><text x="110" y="138" fill="#8e99aa" font-size="15">Verify data and loading</text></g>
    <g transform="translate(550 405)"><rect width="220" height="160" rx="24" fill="#151d2a" stroke="#58b7d8" stroke-opacity=".45"/><circle cx="110" cy="52" r="27" fill="#58b7d8" opacity=".17"/><path d="M92 41h36v25h-18l-12 10V66h-6z" fill="none" stroke="#6bd2ef" stroke-width="4"/><text x="110" y="112" fill="#fff" font-size="20" font-weight="700">6. Ask support</text><text x="110" y="138" fill="#8e99aa" font-size="15">Judge the real answer</text></g>
    <g transform="translate(306 405)"><rect width="220" height="160" rx="24" fill="#171d25" stroke="#54d39a" stroke-opacity=".55"/><circle cx="110" cy="52" r="27" fill="#54d39a" opacity=".17"/><path d="M96 52l9 9 20-22" fill="none" stroke="#54d39a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="112" fill="#fff" font-size="20" font-weight="700">7. Decide</text><text x="110" y="138" fill="#8e99aa" font-size="15">Choose a short plan first</text></g>
  </g>
</svg>
