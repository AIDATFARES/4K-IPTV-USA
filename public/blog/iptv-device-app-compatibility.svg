<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">IPTV device and app compatibility comparison</title>
  <desc id="desc">Generic television, streaming stick, set top box, and mobile devices connect to compatible app cards.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080b15"/><stop offset="1" stop-color="#121421"/></linearGradient><linearGradient id="hub" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2468d8"/><stop offset="1" stop-color="#e1a525"/></linearGradient></defs>
  <rect width="1200" height="675" rx="34" fill="url(#bg)"/>
  <text x="600" y="78" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="30" font-weight="700">MATCH THE SERVICE TO YOUR DEVICE AND APP</text>
  <g fill="none" stroke="#5f80aa" stroke-width="3" stroke-dasharray="8 9" opacity=".55"><path d="M250 230L495 302M250 456l245-83M950 230L705 302M950 456l-245-83"/></g>
  <circle cx="600" cy="338" r="124" fill="url(#hub)" opacity=".18"/><circle cx="600" cy="338" r="91" fill="#171c29" stroke="#f2ba3e" stroke-opacity=".5" stroke-width="3"/>
  <rect x="552" y="296" width="96" height="65" rx="9" fill="none" stroke="#f2ba3e" stroke-width="5"/><path d="M582 378h36m-18-17v17" stroke="#f2ba3e" stroke-width="5" stroke-linecap="round"/>
  <text x="600" y="417" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="18" font-weight="700">CONFIRM SETUP</text>
  <g font-family="Arial, sans-serif">
    <g transform="translate(70 150)"><rect width="360" height="160" rx="24" fill="#171a25" stroke="#4d98ff" stroke-opacity=".4"/><rect x="35" y="38" width="115" height="72" rx="8" fill="none" stroke="#63a8ff" stroke-width="5"/><path d="M75 126h35m-18-16v16" stroke="#63a8ff" stroke-width="5"/><text x="182" y="66" fill="#fff" font-size="22" font-weight="700">Smart TV</text><text x="182" y="96" fill="#929baa" font-size="16">Check OS and app store</text><text x="182" y="122" fill="#929baa" font-size="16">support before paying.</text></g>
    <g transform="translate(70 382)"><rect width="360" height="160" rx="24" fill="#171a25" stroke="#f1b73b" stroke-opacity=".4"/><rect x="54" y="43" width="72" height="72" rx="20" fill="none" stroke="#f1b73b" stroke-width="5"/><circle cx="90" cy="79" r="8" fill="#f1b73b"/><text x="162" y="66" fill="#fff" font-size="22" font-weight="700">Streaming device</text><text x="162" y="96" fill="#929baa" font-size="16">Confirm login format and</text><text x="162" y="122" fill="#929baa" font-size="16">installation method.</text></g>
    <g transform="translate(770 150)"><rect width="360" height="160" rx="24" fill="#171a25" stroke="#4d98ff" stroke-opacity=".4"/><rect x="62" y="34" width="56" height="92" rx="12" fill="none" stroke="#63a8ff" stroke-width="5"/><circle cx="90" cy="111" r="4" fill="#63a8ff"/><text x="154" y="66" fill="#fff" font-size="22" font-weight="700">Mobile and tablet</text><text x="154" y="96" fill="#929baa" font-size="16">Test the exact app and</text><text x="154" y="122" fill="#929baa" font-size="16">account credentials.</text></g>
    <g transform="translate(770 382)"><rect width="360" height="160" rx="24" fill="#171a25" stroke="#f1b73b" stroke-opacity=".4"/><rect x="42" y="48" width="96" height="62" rx="12" fill="none" stroke="#f1b73b" stroke-width="5"/><circle cx="65" cy="79" r="6" fill="#f1b73b"/><path d="M82 79h22" stroke="#f1b73b" stroke-width="5" stroke-linecap="round"/><text x="164" y="66" fill="#fff" font-size="22" font-weight="700">Set-top box</text><text x="164" y="96" fill="#929baa" font-size="16">Confirm portal or app</text><text x="164" y="122" fill="#929baa" font-size="16">activation requirements.</text></g>
